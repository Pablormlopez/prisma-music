name: Verificar APK publicada
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-published-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Descargar APKs públicas y verificar firma
        run: |
          curl --fail --location --retry 3 https://github.com/nexlibre/prisma-music/releases/download/v3.0.1-beta/Prisma-Music-3.0.1-beta.apk -o previous.apk
          curl --fail --location --retry 3 https://github.com/nexlibre/prisma-music/releases/download/v3.0.2-beta/Prisma-Music-3.0.2-beta.apk -o current.apk
          echo "e65cf2a342e26dd7acbf954c8251dbc8fa9b0a71e42de35ba1475ae51c0bfea3  current.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs previous.apk > previous-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs current.apk > current-cert.txt
          diff <(grep 'certificate SHA-256 digest' previous-cert.txt) <(grep 'certificate SHA-256 digest' current-cert.txt)
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install previous.apk
            adb install -r current.apk
            adb shell dumpsys package com.prisma.music > installed-package.txt
            grep 'versionName=3.0.2-beta' installed-package.txt
            adb logcat -c
            adb shell am start -W -n com.prisma.music/.MainActivity
            sleep 5
            adb shell pidof com.prisma.music
            adb logcat -d -s AndroidRuntime:E > crash-log.txt
            ! grep -q 'FATAL EXCEPTION' crash-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK-publica-verificacion
          path: |
            *-cert.txt
            installed-package.txt
            crash-log.txt
