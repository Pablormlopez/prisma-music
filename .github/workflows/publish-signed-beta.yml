name: Publicar beta firmada
on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: publicar-beta
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Reconstruir y verificar APK firmada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, re, subprocess
          from pathlib import Path
          request=json.loads(Path('.github/release-request.json').read_text())
          assert re.fullmatch(r'6\.0\.1-beta', request['version'])
          assert re.fullmatch(r'[0-9a-f]{40}', request['target'])
          assert re.fullmatch(r'[0-9a-f]{64}', request['sha256'])
          assert request['repository']=='nexlibre/prisma-music'
          assert len(request['validation_runs'])==3
          for run_id in request['validation_runs']:
              assert isinstance(run_id,int)
              raw=subprocess.check_output(['gh','api','repos/'+request['repository']+'/actions/runs/'+str(run_id)])
              run=json.loads(raw)
              assert run['head_sha']==request['target']
              assert run['status']=='completed' and run['conclusion']=='success', 'Source checks must pass before publishing'

          apk=Path('Prisma-Music-'+request['version']+'.apk')
          with apk.open('wb') as output:
              for blob in request['blobs']:
                  assert re.fullmatch(r'[0-9a-f]{40}', blob)
                  raw=subprocess.check_output(['gh','api','repos/'+request['repository']+'/git/blobs/'+blob])
                  output.write(base64.b64decode(json.loads(raw)['content']))
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==request['sha256']
          Path(str(apk)+'.sha256').write_text(request['sha256']+'  '+apk.name+'\n')
          Path('release-notes.md').write_text(request['notes'])
          PY
          curl --fail --location --retry 3 https://github.com/nexlibre/prisma-music/releases/download/v5.0.2-beta/Prisma-Music-5.0.2-beta.apk -o previous.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs previous.apk > previous-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Prisma-Music-6.0.1-beta.apk > current-cert.txt
          diff <(grep 'certificate SHA-256 digest' previous-cert.txt) <(grep 'certificate SHA-256 digest' current-cert.txt)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Prisma-Music-6.0.1-beta.apk | grep "versionCode='20'.*versionName='6.0.1-beta'"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install previous.apk
            adb install -r Prisma-Music-6.0.1-beta.apk
            adb shell dumpsys package com.prisma.music | grep 'versionName=6.0.1-beta'
            adb logcat -c
            adb shell am start -W -n com.prisma.music/.MainActivity
            adb shell pidof com.prisma.music
            adb logcat -d -s AndroidRuntime:E > crash-log.txt
            ! grep -q 'FATAL EXCEPTION' crash-log.txt
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target=$(jq -r .target .github/release-request.json)
          gh release create v6.0.1-beta Prisma-Music-6.0.1-beta.apk Prisma-Music-6.0.1-beta.apk.sha256 --target "$target" --prerelease --title "Prisma Music 6.0.1 beta" --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Beta-firmada-verificacion
          path: |
            *-cert.txt
            crash-log.txt
          retention-days: 14
