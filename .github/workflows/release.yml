name: Preparar APK de distribución
on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preparar-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle testDebugUnitTest assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Music-release-sin-firmar
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
