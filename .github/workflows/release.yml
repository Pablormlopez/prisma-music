name: Publicar beta instalable
on:
  push:
    branches: [main]
    paths: ['app/build.gradle.kts', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-beta
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar y revisar distribución
        run: gradle testDebugUnitTest assembleRelease lintRelease --no-daemon
      - name: Verificar firma y paquete
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -5
          cp app/build/outputs/apk/release/app-release.apk Prisma-Music-0.1.1-beta.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar APK de distribución en Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash scripts/verify-release-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Music-distribucion
          path: Prisma-Music-0.1.1-beta.apk
      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1-beta >/dev/null 2>&1; then
            echo 'La versión ya existe. No se sobrescribe una APK publicada.'
          else
            gh release create v0.1.1-beta Prisma-Music-0.1.1-beta.apk --target "$GITHUB_SHA" --title 'Prisma Music 0.1.1 beta' --prerelease --notes 'APK de distribución sin depuración. Firma verificada, pruebas unitarias y lint. Instalación y apertura verificadas en Android 13 emulado. Android 8 o posterior. Firma temporal de beta: no se garantiza actualizar sobre otras compilaciones. Letras locales LRC; Liquid Glass inicial.'
          fi
